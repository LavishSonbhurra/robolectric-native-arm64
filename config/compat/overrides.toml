# Manual knowledge for the compat target (RA64_TARGET=compat), same format as
# overrides/overrides.toml. Every entry says why it exists.

[closure]
roots = ["librobolectric-nativeruntime"]
headers_only = []

[product_variables]
# The official library has minikin's MINIKIN_ASSERT messages ("Out of range
# access. %d/%d", ...), which only `debuggable` (-DENABLE_ASSERTION) compiles
# in: a userdebug or eng product, as for SDK 36.
debuggable = true
eng = false
platform_sdk_version = 31

[toolchain]
# As for SDK 36 (overrides/overrides.toml): AOSP's clang resource directory
# carries bionic's stdatomic.h, which maps the C11 names onto std::atomic in
# C++. clang 21's own one breaks C++ code that includes <atomic> as well
# (libc++ 21: "<atomic> is incompatible with <stdatomic.h> before C++23").
# The C++ library, as Soong's Android 12 cc/stl.go uses it for hosts: the
# tree's own libc++ (external/libcxx, LLVM 12 era, with libc++abi), not the
# toolchain's libc++ 21. The reference has this one (no
# __libcpp_verbose_abort, which LLVM 15 added; libc++abi exported, libgcc's
# unwinder), and libc++ 21 rejects Android 12 code that this one accepts
# (vector of incomplete or const types, allocators without rebind).
stl_module = "libc++_static"
# Static libraries of the final link in Soong's order (bp2cmake
# soong_topological_order): each library before those it depends on.
# Symbols defined in two archives resolve as in Soong: android::ColorSpace
# comes from hwui's HostColorSpace.cpp (hidden, as in the reference), not
# from libui-types, which links after libhwui.
link_order = "soong-topological"
builtin_headers = { "stdatomic.h" = "bionic/libc/include/stdatomic.h", "bits/stdatomic.h" = "bionic/libc/include/bits/stdatomic.h" }

[compat]
# Extra flags appended to every C and C++ compile, after Soong's own. Soong
# built this tree with clang-r416183b1 (clang 12.0.7); we use clang 21. Only
# warnings that clang 13..21 introduced or promoted and that break -Werror.
cflags = [
    # New in clang 13, part of -Wall/-Wunused (ICU locid.cpp). Soong
    # downgraded both from Android 13 on (noOverrideGlobalCflags).
    "-Wno-error=unused-but-set-variable",
    "-Wno-error=unused-but-set-parameter",
    # New in clang 15, on by default (ICU uspoof_impl.cpp, array == array).
    "-Wno-error=array-compare",
    # New or promoted to errors-by-default between clang 13 and clang 21:
    "-Wno-error=deprecated-non-prototype",       # clang 15 (zlib K&R definitions)
    "-Wno-error=deprecated-literal-operator",    # clang 20 (fmtlib, hwui TimeUtils.h)
    "-Wno-error=cast-function-type-mismatch",    # clang 19 (sqlite, libutils Threads.cpp)
    "-Wno-error=null-pointer-subtraction",       # clang 13 (libpng pngrutil.c)
    "-Wno-error=vla-cxx-extension",              # clang 18 (hwui VectorDrawable, libbase cmsg)
    "-Wno-error=missing-designated-field-initializers",  # clang 19 (androidfw, libcutils)
    "-Wno-error=thread-safety-reference-return", # clang 16 (minikin Font.cpp)
    "-Wno-error=invalid-offsetof",               # clang 16 promoted (libutils String16)
    "-Wno-error=bitwise-instead-of-logical",     # clang 14 (Skia SkColorFilter, SkPathEffect)
    "-Wno-error=array-parameter",                # clang 13 (Skia SkGeometry, SkMatrix, ...)
    "-Wno-error=deprecated-this-capture",        # clang 17, C++20 [=] capturing this (hwui RenderProxy)
    "-Wno-error=character-conversion",
    "-Wno-error=unnecessary-virtual-specifier",
    "-Wno-error=nontrivial-memcall",
]
conlyflags = []
cppflags = [
    "-Wno-invalid-specialization",
]

[module.libcompiler_rt-extras]
external = true

[module.librobolectric-nativeruntime]
# Soong adds -static-libgcc in target.linux_glibc_x86_64 only (there is no
# linux_glibc_arm64 toolchain); the same flag is the arm64 equivalent.
props = { ldflags = ["-static-libgcc"] }

[module.libskia.arch.arm64]
# external/skia/Android.bp (generated by gn_to_bp) puts -mssse3 in
# target.linux_glibc (and darwin, windows) because every host Soong built
# for was x86. clang rejects it for aarch64. Google's mac/aarch64 build of
# the same library cannot have used it either. The arm64 baseline (NEON) is
# what Skia's runtime CPU detection expects; x86_64 keeps the flag.
remove_cflags = ["-mssse3"]

[module.libcutils]
# threads.cpp only defines gettid() when glibc is older than 2.32 (it
# assumes glibc 2.32 added it; 2.30 did). Soong's glibc 2.17 sysroot has
# none, so it compiled there; against our glibc 2.31 headers its declaration
# clashes with glibc's (exception specification). The reference library has
# no gettid symbol, defined or imported, so the object was never linked.
props = { exclude_srcs = ["threads.cpp"] }

[module.libharfbuzz_ng]
# hb.hh turns -Wunused into an error with a pragma, which no command-line
# flag overrides, and clang 13+ counts an unused-but-set variable in
# hb-subset-cff1.cc as -Wunused. Subsetting is not used: the reference has
# no hb_subset symbols, so the object was never linked.
props = { exclude_srcs = ["src/hb-subset-cff1.cc"] }

# ---- Pixel modes (RA64_PIXELS) ----------------------------------------------
# Optional: make arm64 render like the x86_64 build (docs: plan/compat-spike.md).
# "native" (the default) adds nothing. Each mode below adds flags to every
# module that compiles Skia code or includes Skia headers (libskia, libhwui,
# librobolectric-nativeruntime), so inline code agrees across them. They only
# apply to arm64. patches/external/skia/0001 makes Skia's arm64 shortcuts also
# require NEON, so the code below can build with NEON off.

# x86: Skia's x86 SSSE3 code paths (what the x86_64 build and its qemu
# goldens run), with the SSE intrinsics provided by SIMDe in plain C
# (pixels/x86-include/ra64_x86_simde.h, third_party/simde). __SSE*__ select
# the same code as -mssse3 does on x86_64; -ffp-contract=off because x86 SSE
# has no fused multiply-add, so a*b+c must round twice there as well.
[pixels.x86.module.libskia.arch.arm64]
props = { cflags = ["-U__ARM_NEON", "-U__ARM_NEON__", "-D__SSE__", "-D__SSE2__", "-D__SSE3__", "-D__SSSE3__", "-ffp-contract=off", "-isystem{config}/pixels/x86-include", "-isystem{src}/third_party/simde"] }
[pixels.x86.module.libhwui.arch.arm64]
props = { cflags = ["-U__ARM_NEON", "-U__ARM_NEON__", "-D__SSE__", "-D__SSE2__", "-D__SSE3__", "-D__SSSE3__", "-ffp-contract=off", "-isystem{config}/pixels/x86-include", "-isystem{src}/third_party/simde"] }
[pixels.x86.module.librobolectric-nativeruntime.arch.arm64]
props = { cflags = ["-U__ARM_NEON", "-U__ARM_NEON__", "-D__SSE__", "-D__SSE2__", "-D__SSE3__", "-D__SSSE3__", "-ffp-contract=off", "-isystem{config}/pixels/x86-include", "-isystem{src}/third_party/simde"] }

# zlib: the x86_64 host build has no SIMD (-DCPU_NO_SIMD) and hashes deflate input the
# plain way; on arm64 it uses the CRC32C hash, which finds other matches, so compressed
# output (PNG encode, for one) differs by a few bytes. Without CRC32_ARMV8_CRC32 it hashes
# the plain way (CHROMIUM_ZLIB_NO_CASTAGNOLI, the switch meant for this, does not compile
# in this zlib). CRC-32 values are the same either way.
[pixels.x86.module.libz.arch.arm64]
props = { cflags = ["-UCRC32_ARMV8_CRC32"] }

# portable (measured, not recommended): no NEON and no SkNx/SkVx SIMD. The
# raster pipeline falls back to JUMPER_IS_SCALAR, which has no lowp stages.
[pixels.portable.module.libskia.arch.arm64]
props = { cflags = ["-U__ARM_NEON", "-U__ARM_NEON__", "-DSKNX_NO_SIMD", "-ffp-contract=off"] }
[pixels.portable.module.libhwui.arch.arm64]
props = { cflags = ["-U__ARM_NEON", "-U__ARM_NEON__", "-DSKNX_NO_SIMD", "-ffp-contract=off"] }
[pixels.portable.module.librobolectric-nativeruntime.arch.arm64]
props = { cflags = ["-U__ARM_NEON", "-U__ARM_NEON__", "-DSKNX_NO_SIMD", "-ffp-contract=off"] }
