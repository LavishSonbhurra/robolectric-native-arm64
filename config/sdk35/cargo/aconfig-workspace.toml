# Workspace manifest used instead of build/make/tools/aconfig/Cargo.toml when
# building the aconfig tools out of tree, as tools/cargo/ does for SDK 36. At
# android-15.0.0_r1 the code generator needs aconfig_protos and
# aconfig_storage_file only.
[workspace]
members = [
    "aconfig",
    "aconfig_protos",
    "aconfig_storage_file",
]
resolver = "2"

# Use the cxx crate from external/rust/cxx, the version Soong uses, so the
# Rust side matches the C++ bridge code generated by its cxxbridge.
[patch.crates-io]
cxx = { path = "../../../../external/rust/cxx" }
cxx-build = { path = "../../../../external/rust/cxx/gen/build" }
cxxbridge-flags = { path = "../../../../external/rust/cxx/flags" }
cxxbridge-macro = { path = "../../../../external/rust/cxx/macro" }
