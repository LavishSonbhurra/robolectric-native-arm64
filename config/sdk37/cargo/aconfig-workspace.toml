# Workspace manifest used instead of build/make/tools/aconfig/Cargo.toml when
# building the aconfig tools out of tree. Upstream's workspace also lists
# aflags, which needs packages/modules/ConfigInfrastructure; we only need the
# code generator and the storage read API.
[workspace]
members = [
    "aconfig",
    "aconfig_protos",
    "aconfig_storage_file",
    "aconfig_storage_read_api",
    "convert_finalized_flags",
]
resolver = "2"

# Use the cxx crate from external/rust/cxx (1.0.119), the version Soong uses,
# so the Rust side matches the C++ bridge code generated by its cxxbridge.
[patch.crates-io]
cxx = { path = "../../../../external/rust/cxx" }
cxx-build = { path = "../../../../external/rust/cxx/gen/build" }
cxxbridge-flags = { path = "../../../../external/rust/cxx/flags" }
cxxbridge-macro = { path = "../../../../external/rust/cxx/macro" }
