# SPDX-License-Identifier: Apache-2.0
#
# Uploads an existing GitHub release to the Maven Central Portal. Run by hand, once the tag's CI has
# passed and the GitHub release is published, from a commit whose Gradle versions match that release.
# A draft will not do: this workflow's read-only token cannot see drafts.
#
# This version of the workflow has not run yet. The one before it reached VALIDATED with the
# single-library layout; the jobs below are new, and were tried locally only as far as a workflow
# can be: the check, the rig through the artifacts and a bundle signed with a throwaway key.
#
#   verify  builds the Maven repository from the release's own libraries and notices, and compares
#           every artifact with the release in both directions (ci/check-release.py). Any difference
#           stops the job, so what goes to Central is what was tested and attested.
#   rig     the fidelity rig at SDK 30, 34, 35, 36 and 37, depending on the loader artifact alone,
#           from that repository, the way a user's build does.
#   upload  signs that same repository and uploads it. Only this job can read the secrets.
#
# The upload stops at VALIDATED: nothing is public until someone presses Publish in the Portal, and
# that step cannot be undone. See docs/DISTRIBUTION.md, section 8.
#
# Secrets, in the maven-central environment:
#   CENTRAL_USERNAME, CENTRAL_PASSWORD   a Portal user token
#   SIGNING_KEY, SIGNING_PASSPHRASE      the release key, ASCII armored
name: Upload to Maven Central

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v4.17-1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # One checksum file per build: the loader, each SDK and compat. A missing one fails the job.
      - name: Download the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          for sums in SHA256SUMS sdk35-SHA256SUMS sdk36-SHA256SUMS sdk37-SHA256SUMS compat-SHA256SUMS; do
            sha256sum --check --strict "$sums"
          done

      - name: Build the Maven repository
        run: |
          ./gradlew --no-daemon publishAllPublicationsToStagingRepository --no-build-cache \
            -Pra64.sdk35Lib="$PWD/release/libandroid_runtime-sdk35.so" \
            -Pra64.sdk35Notice="$PWD/release/sdk35-THIRD_PARTY_NOTICES" \
            -Pra64.sdk36Lib="$PWD/release/libandroid_runtime-sdk36.so" \
            -Pra64.sdk36Notice="$PWD/release/sdk36-THIRD_PARTY_NOTICES" \
            -Pra64.sdk37Lib="$PWD/release/libandroid_runtime-sdk37.so" \
            -Pra64.sdk37Notice="$PWD/release/sdk37-THIRD_PARTY_NOTICES" \
            -Pra64.compatLib="$PWD/release/librobolectric-nativeruntime.so" \
            -Pra64.compatNotice="$PWD/release/compat-THIRD_PARTY_NOTICES" \
            -Pra64.compatX86Lib="$PWD/release/librobolectric-nativeruntime-x86pixels.so" \
            -Pra64.compatX86Notice="$PWD/release/compat-x86pixels-THIRD_PARTY_NOTICES"

      - name: Compare every artifact with the release
        run: python3 -I ci/check-release.py --repo build/central-staging --release release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-staging
          path: build/central-staging
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------------------------
  rig:
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sdk: [30, 34, 35, 36, 37]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: central-staging
          path: build/central-staging

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        id: android-sdk
        continue-on-error: true
        with:
          packages: "platforms;android-36 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false
      # The platform zip sometimes arrives corrupted on GitHub's arm runners. Retry the install
      # with the action's sdkmanager when that happens.
      - name: Retry the Android SDK install
        if: steps.android-sdk.outcome == 'failure'
        run: |
          sdk="$HOME/.android/sdk"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          mgr=$(ls "$sdk"/cmdline-tools/*/bin/sdkmanager | head -1)
          for i in 1 2 3; do
            rm -rf "$sdk/.temp"
            yes | "$mgr" --licenses > /dev/null || true
            if "$mgr" --install "platforms;android-36" "build-tools;35.0.0"; then exit 0; fi
            sleep 20
          done
          exit 1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: amd64

      - name: Build the amd64 sysroot for aapt2
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends gpgv debian-archive-keyring python3-pil
          python3 -I toolchain/make-sysroot.py --arch amd64
          echo "QEMU_LD_PREFIX=$PWD/toolchain/out/sysroot-bullseye-amd64" >> "$GITHUB_ENV"

      - name: Run the rig through the artifacts
        run: |
          repo="$PWD/build/central-staging"
          # Directories only: maven-metadata.xml sits next to the version directory.
          version=$(find "$repo/io/github/lavishsonbhurra/robolectric-nativeruntime-linux-aarch64" \
            -mindepth 1 -maxdepth 1 -type d -printf '%f')
          RIG_SDK=${{ matrix.sdk }} RIG_ARM64_JDK="$JAVA_HOME" RIG_ARTIFACT_REPO="$repo" \
            RIG_ARTIFACT_VERSION="$version" tests/rig/scripts/run.sh arm64

      - name: Check the run
        run: tests/rig/scripts/check-artifacts.sh ${{ matrix.sdk }} "$PWD/tests/rig/out/arm64"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rig-artifacts-sdk${{ matrix.sdk }}
          path: tests/rig/out/arm64
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  upload:
    needs: [verify, rig]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    environment: maven-central
    env:
      # Full fingerprint. The public key is on keyserver.ubuntu.com.
      SIGNING_KEY_ID: 4E2CCCBC8495F4B2CFC79ADA40010BA3FD767082
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: central-staging
          path: build/central-staging

      - name: Sign and bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          printenv SIGNING_KEY | gpg --batch --quiet --import
          passphrase_file="$GNUPGHOME/passphrase"
          printenv SIGNING_PASSPHRASE > "$passphrase_file"
          python3 tools/central_bundle.py --repo build/central-staging --key "$SIGNING_KEY_ID" \
            --passphrase-file "$passphrase_file" --out central-bundle.zip
          rm -rf "$GNUPGHOME"

      - name: Upload
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: python3 tools/central_upload.py --bundle central-bundle.zip --name "$TAG"
